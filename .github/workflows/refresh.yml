name: update-prices
on:
  schedule:
    - cron: "17 */9 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Refresh prices
        if: github.event_name != 'push'
        run: |
          python3 refresh.py catalog.json data.json
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update prices"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
