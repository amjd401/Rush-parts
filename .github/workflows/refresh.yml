name: update-prices
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -c "import json,datetime as d;t=d.datetime.fromisoformat(json.load(open('data.json'))['checked_at']);h=(d.datetime.now(d.timezone.utc)-t).total_seconds()/3600;print('run='+('true' if h>=8.75 else 'false'))" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Refresh prices
        if: github.event_name != 'push'
        run: |
          python3 refresh.py catalog.json data.json
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update prices"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
